name: Datos de gruposancarlos.pro
on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * *"
  push:
    paths: [herramientas/datos.py, herramientas/generar_sitio.py, .github/workflows/datos.yml]
permissions:
  contents: write
jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install gspread==6.1.2 google-auth==2.34.0
      - env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          HOJA_KRM: 1P01QJ5H5-fCmwwGQWvjhciB3RdqxOa5YskP572Lxc4c
        run: mkdir -p datos && python -u herramientas/datos.py | tee datos/registro.txt
      - name: Regenerar sitio con los datos del dia
        run: python -u herramientas/generar_sitio.py
      - run: |
          git config user.email "claude@acierta.pro"; git config user.name "Datos automaticos"
          git add datos index.html desarrollos sitemap.xml robots.txt; git diff --cached --quiet || (git commit -m "Datos de Grupo San Carlos" && git push)
